name: grade_wise
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.jpg"
flutter_native_splash:
  color: "#ffffff"
  image: assets/app_logo.jpg
  android_12:
    image: assets/app_logo.jpg
    color: "#ffffff"  

flutter:

  uses-material-design: true
  assets:
    - "assets/app_logo.jpg"
